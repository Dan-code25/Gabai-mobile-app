plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.offlineocr'
version = '0.1.0'

android {
  namespace 'expo.modules.offlineocr'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Includes the Latin model in the APK; no first-use model download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
